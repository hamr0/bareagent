name: CI

# Runs on every push and PR. The typecheck step (tsc --checkJs against the
# JSDoc) is the guardrail that stops type mistakes reaching main; tests follow.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --checkJs)
        run: npm run typecheck
      - name: Test
        run: npm test
